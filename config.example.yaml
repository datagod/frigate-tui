# Frigate TUI configuration example
# Copy to config.yaml (next to this file) or place at ~/.config/frigate-tui/config.yaml

frigate_url: "http://localhost:5000"   # or http://your-frigate-host:5000
timezone: America/New_York             # display all timestamps in this zone (EDT/EST)
poll_interval: 5.0                     # seconds between /api/stats refreshes (web UI control uses 1s steps)
review_interval: 8.0                   # seconds between review polls (for activity log)
timeline_interval: 5.0                 # seconds between timeline polls (for activity log)
timeline_log_enabled: true             # false = no Visible/Gone/Stationary lines in Activity Log
timeline_log_stationary: false         # stationary rows are noisy; enable if you want them
timeline_log_gone_min_score: 0.80      # min score to log Gone when a face/plate sub_label is present
timeline_log_visible_min_score: 0.85   # min score for Visible without a sub_label (recognized faces always log)
stats_log_interval: 600.0              # seconds between "Stats OK" messages in the Activity Log (errors always log immediately). Default is 10 minutes.
max_events: 150                        # how many events to keep in the live table
events_poll_interval: 8.0              # HTTP poll for /api/events (always on; keeps Events tab near Activity Log)
events_reconcile_interval: 10.0        # full list resync from /api/events (heals MQTT/API cursor gaps)

# Optional auth (only needed if your Frigate requires login and you are not on a trusted host)
# auth:
#   username: "admin"
#   password: "your-password"

theme: "dark"                          # reserved for future theme switching

# Real-time events via MQTT (recommended over polling).
# Also required for low-latency Frigate GenAI/LLM object descriptions in the Activity Log
# (frigate/tracked_object_update). Without MQTT, descriptions still appear via HTTP polling.
mqtt:
  host: "mqtt"                 # When using docker compose with network_mode: container:frigate
  port: 1883
  username: ""
  password: ""
  topic_prefix: "frigate"

# GenAI Activity Report tab (web/TUI): hourly LLM summary of review/object GenAI messages
# Uses the same Ollama/OpenAI-compatible endpoint as Frigate when base_url/model are omitted.
genai_report:
  default_hours: 6.0               # default window for Summary tab and GenAI Log
  base_url: http://ollama:11434
  model: llama3.2:latest
  timeout: 180
  health_probe_timeout: 8          # LLM reachability check on Health tab (seconds)

genai_health_interval: 30          # seconds between automatic GenAI health probes

# Web Summary tab: Frigate native review summarize report (POST /api/review/summarize)
frigate_report:
  auto_interval: 600               # seconds between auto-refresh in browser (0 = disabled)
  save_dir: reports              # Frigate_GenAI_Report_YYYYMMDD_HHMMSS.txt files

# Chatterbox TTS Server — manual voice test on Overview tab (clone voice from reference_audio/)
chatterbox_tts:
  enabled: true
  base_url: http://host.docker.internal:8004   # or http://chatterbox-tts-server:8004 on shared Docker network
  voice_mode: clone
  reference_audio_filename: JLC_William_McEvoy.mp3
  output_format: wav
  split_text: false
  timeout: 60
  cache_dir: localrecordings   # cached WAV/MP3 keyed by message text; replayed without calling Chatterbox
  event_alerts: true           # new detections: speak "{label} on {camera}" via Chatterbox
  event_template: "{label} on {camera}"
  default_test_message: "Person detected on driveway."

# Web UI alert sounds (browser only; queued playback). Place MP3/WAV files in ./sounds/
web_alerts:
  enabled: true
  max_queue: 24
  sounds:
    default: ""              # built-in chime when no mapping / unknown kind
    event: Alert.mp3         # new detection (non-dog)
    dog: DogDetected.mp3     # label/sub_label matches dog
    # review: review.mp3     # future: review / GenAI notifications
    # notification: ping.mp3

# Mounted into Docker containers as /app/config.yaml (see README Installation).
# Web UI is served on :8080 via docker compose --profile web.
