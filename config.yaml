# Frigate TUI Configuration
# This is a working config for your current setup.

frigate_url: "http://localhost:5000"
timezone: America/New_York
poll_interval: 30.0
review_interval: 30.0
timeline_interval: 30.0
events_poll_interval: 30.0        # HTTP refresh of Events tab (runs with MQTT too)
events_reconcile_interval: 60.0  # full /api/events resync to heal gaps
stats_log_interval: 600.0   # seconds between "Stats OK" messages in the Activity Log (default is now 600 / 10min)
max_events: 150

# Real-time events via MQTT (no more polling for new detections)
mqtt:
  host: "mqtt"
  port: 1883
  username: ""
  password: ""
  topic_prefix: "frigate"

# GenAI Activity Report tab — sends collected GenAI messages to an LLM for hourly summaries
genai_report:
  default_hours: 1.0
  base_url: http://ollama:11434
  model: qwen2.5:3b
  timeout: 180

frigate_report:
  auto_interval: 600
  save_dir: reports

# Chatterbox TTS (manual test on Overview tab; POST /tts with cloned voice)
chatterbox_tts:
  enabled: true
  base_url: http://host.docker.internal:8004
  voice_mode: clone
  reference_audio_filename: JLC_William_McEvoy.mp3
  output_format: wav
  split_text: false
  timeout: 60
  cache_dir: localrecordings
  event_alerts: true
  event_template: "{label} on {camera}"
  default_test_message: "Person detected on driveway."

# Logs tab — live Docker logs from the Frigate container (mount docker.sock in docker-compose)
frigate_logs:
  enabled: true
  container: frigate
  initial_lines: 200

# Video History tab — browse Frigate continuous recordings (mount directory in docker-compose)
video_history:
  enabled: true
  recordings_dir: /storage/recordings
  max_files: 500
