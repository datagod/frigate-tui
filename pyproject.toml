[project]
name = "frigate-tui"
version = "0.1.0"
description = "Advanced colorful terminal UI for monitoring a Frigate NVR (queues, detections, events, camera health)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Frigate TUI Contributors"}
]
keywords = ["frigate", "nvr", "tui", "terminal", "monitoring", "textual", "surveillance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

dependencies = [
  "textual>=0.80.0",
  "httpx>=0.27.0",
  "typer>=0.9.0",
  "pyyaml>=6.0",
  "rich>=14.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "textual-dev>=1.5.0",
  "ruff>=0.4.0",
  "pytest>=8.0.0",
  "respx>=0.21.0",
  "mypy>=1.10.0",
]

[project.scripts]
frigate-tui = "frigate_tui.cli:main"

[project.urls]
Homepage = "https://github.com/datagod/frigate-tui"
Repository = "https://github.com/datagod/frigate-tui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frigate_tui"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.textual]
# Enables `textual run --dev frigate_tui.app:FrigateMonitor`
# and the F2 debug console during development
